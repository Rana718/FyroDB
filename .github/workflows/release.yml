name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

jobs:
  docker:
    name: Docker & GitHub Packages Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/fyrodb
            ghcr.io/${{ github.repository }}
          # `latest` only for stable releases (vX.Y.Z); a pre-release such
          # as v1.2.0-rc.1 gets its version tag but never moves `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=FyroDB
            org.opencontainers.image.description=Blazing fast Redis-compatible in-memory KV store and DB cache proxy
            org.opencontainers.image.url=https://hub.docker.com/r/rana718/fyrodb
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://fyro-db.vercel.app/docs

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    name: Publish Release Notes
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and Validate Changeset Notes
        id: changeset
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Resolving changeset for tag: $TAG (version: $VERSION)"

          CANDIDATES=(
            ".changeset/${VERSION}-changeset.md"
            ".changeset/${VERSION}-charset.md"
            ".changeset/${TAG}-changeset.md"
            ".changeset/${TAG}-charset.md"
            ".changeset/${VERSION}.md"
            ".changeset/${TAG}.md"
          )

          MATCH=""
          for candidate in "${CANDIDATES[@]}"; do
            if [[ -f "$candidate" ]]; then
              MATCH="$candidate"
              break
            fi
          done

          if [[ -n "$MATCH" ]]; then
            echo "Found matching changeset file: $MATCH"
            echo "CHANGESET_FILE=$MATCH" >> "$GITHUB_ENV"
          else
            echo "No matching file found in .changeset/, attempting extraction from CHANGELOG.md..."
            if python3 -c "
          import sys, re
          version = sys.argv[1]
          with open('CHANGELOG.md') as f:
              content = f.read()
          pattern = r'## \[' + re.escape(version) + r'\].*?(?=(## \[|\Z))'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              with open('.changeset_extracted.md', 'w') as out:
                  out.write(match.group(0).strip() + '\n')
              sys.exit(0)
          sys.exit(1)
          " "$VERSION"; then
              echo "Extracted release notes from CHANGELOG.md"
              echo "CHANGESET_FILE=.changeset_extracted.md" >> "$GITHUB_ENV"
            else
              echo "::error::No changeset file found in .changeset/ and no matching entry in CHANGELOG.md for version $VERSION."
              echo "Please create .changeset/${VERSION}-changeset.md containing this version's changelog."
              exit 1
            fi
          fi

          if [[ "$TAG" =~ -(alpha|beta|rc|dev) ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FyroDB ${{ env.TAG }}"
          body_path: ${{ env.CHANGESET_FILE }}
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
