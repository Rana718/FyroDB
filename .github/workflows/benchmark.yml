name: PR Benchmark Comparison

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: false
        type: string

permissions:
  pull-requests: write
  contents: read

jobs:
  benchmark-compare:
    name: Compare Benchmarks (Base vs PR)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["benchmark", "bench", "perf", "benchmark-validation"]'), github.event.label.name))
    runs-on: ubuntu-latest
    steps:
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'main' }}
          path: base

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            base -> target
            pr -> target

      - name: Run Baseline Benchmark
        working-directory: base
        run: cargo bench --bench without_tcp --locked -- -m bench --json ../base_results.json

      - name: Run PR Benchmark
        working-directory: pr
        run: cargo bench --bench without_tcp --locked -- -m bench --json ../pr_results.json

      - name: Generate Comparison Table
        run: |
          BASE_NAME="${{ github.event.pull_request.base.ref || 'base' }}"
          PR_NAME="PR #${{ github.event.pull_request.number || github.event.inputs.pr_number || 'current' }}"
          python3 pr/scripts/compare_benchmarks.py base_results.json pr_results.json "$BASE_NAME" "$PR_NAME" > benchmark_report.md
          cat benchmark_report.md

      - name: Post or Update PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('benchmark_report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request
              ? context.payload.pull_request.number
              : (context.payload.inputs ? parseInt(context.payload.inputs.pr_number) : null);

            if (!issue_number || isNaN(issue_number)) {
              console.log("No valid PR number found, skipping comment.");
              return;
            }

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('⚡ FyroDB Automated Benchmark Comparison')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: body,
              });
              console.log(`Updated benchmark comment (${botComment.id}) on PR #${issue_number}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: body,
              });
              console.log(`Created benchmark comment on PR #${issue_number}`);
            }

      - name: Auto-remove Trigger Label
        if: always() && github.event_name == 'pull_request' && github.event.label.name
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelName = context.payload.label ? context.payload.label.name : null;
            const issue_number = context.payload.pull_request ? context.payload.pull_request.number : null;
            if (labelName && issue_number) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  name: labelName,
                });
                console.log(`Successfully removed trigger label '${labelName}' from PR #${issue_number}`);
              } catch (err) {
                console.log(`Could not remove label '${labelName}': ${err.message}`);
              }
            }
