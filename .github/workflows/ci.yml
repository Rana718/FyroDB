name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "tests/**"
      - "bench/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --workspace
        env:
          RUST_TEST_THREADS: 2

      - name: Protocol and isolation regression suites
        run: python3 tests/e2e/python/run.py target/debug/fyro_db

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  benchmark-validation:
    name: Benchmark client validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/go.mod
          cache: false
      - name: Validate benchmark counts and replies
        working-directory: bench
        run: go test -short -timeout 30s ./...
      - name: Validate Docker benchmark harness
        run: python3 scripts/test_bench_matrix.py
