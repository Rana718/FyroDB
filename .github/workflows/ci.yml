name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'benches/**'
      - 'proofs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'benches/**'
      - 'proofs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test & Protocol Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --workspace --locked
        env:
          CARGO_INCREMENTAL: "0"

      - name: Run Protocol Regression Suites
        run: python3 tests/e2e/python/run.py target/debug/fyro_db

      - name: Auto-remove Trigger Label
        if: always() && github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelName = context.payload.label ? context.payload.label.name : null;
            const issue_number = context.payload.pull_request ? context.payload.pull_request.number : null;
            if (labelName && issue_number) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  name: labelName,
                });
                console.log(`Successfully removed trigger label '${labelName}' from PR #${issue_number}`);
              } catch (err) {
                console.log(`Could not remove label '${labelName}': ${err.message}`);
              }
            }
