name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "tests/**"
      - "proofs/verus/**"
      - "bench/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Taskfile.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --workspace
        env:
          RUST_TEST_THREADS: 2

      - name: Protocol and isolation regression suites
        run: python3 tests/e2e/python/run.py target/debug/fyro_db

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  verus:
    name: Verus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Z3
        run: sudo apt-get install -y z3
      - name: Install Task
        run: sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install Verus
        run: |
          mkdir -p $HOME/tools/verus
          # Download and install Verus to match the location expected by Taskfile.yml
          curl -L https://github.com/verus-lang/verus/releases/latest/download/verus-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/tools/verus --strip-components=1
      - name: Run Verus
        run: task verus

  e2e-integration:
    name: E2E Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t fyrodb-test .
      - name: Run Docker Container
        run: docker run -d -p 8000:8000 --name fyrodb-container fyrodb-test
      - name: Install dependencies
        run: pip install redis
      - name: Run E2E Stress Test
        run: python3 scripts/e2e_stress_test.py
      - name: Stop Container
        run: docker stop fyrodb-container

  benchmark-validation:
    name: Benchmark client validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/go.mod
          cache: false
      - name: Validate benchmark counts and replies
        working-directory: bench
        run: go test -short -timeout 30s ./...
      - name: Validate Docker benchmark harness
        run: python3 scripts/test_bench_matrix.py
