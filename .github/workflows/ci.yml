name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$BASE_SHA..$HEAD_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="$BASE_SHA...$HEAD_SHA"
          fi
          if git diff --quiet --no-renames "$range" -- \
            '*.rs' 'Cargo.toml' '*/Cargo.toml' 'Cargo.lock' '*/Cargo.lock' \
            '.cargo/config' '.cargo/config.toml' 'rust-toolchain' 'rust-toolchain.toml' \
            ':(exclude)docs/**'; then
            echo 'rust=false' >> "$GITHUB_OUTPUT"
          else
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --workspace
        env:
          RUST_TEST_THREADS: 2

      - name: Protocol and isolation regression suites
        run: python3 tests/e2e/python/run.py target/debug/fyro_db

  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  verus:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    name: Verus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Task
        run: sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
      - name: Install Verus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 'release/0.2026.11.02.8bf68ee' --repo verus-lang/verus --pattern '*-x86-linux.zip' --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/*-x86-linux.zip -d "$RUNNER_TEMP"
          mkdir -p "$HOME/tools"
          mv "$RUNNER_TEMP/verus-x86-linux" "$HOME/tools/verus"
          "$HOME/tools/verus/z3" --version
          echo "VERUS_Z3_PATH=$HOME/tools/verus/z3" >> "$GITHUB_ENV"
          rustup toolchain install 1.99.1 --profile minimal
      - name: Run Verus
        run: task verus

  e2e-integration:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    name: E2E Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t fyrodb-test .
      - name: Run Docker Container
        run: docker run -d -p 8000:8000 --name fyrodb-container fyrodb-test
      - name: Install dependencies
        run: pip install redis
      - name: Run E2E Stress Test
        run: python3 scripts/e2e_stress_test.py
      - name: Stop Container
        run: docker stop fyrodb-container

  benchmark-validation:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    name: Benchmark client validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/go.mod
          cache: false
      - name: Validate benchmark counts and replies
        working-directory: bench
        run: go test -short -timeout 30s ./...
      - name: Validate Docker benchmark harness
        run: python3 scripts/test_bench_matrix.py
