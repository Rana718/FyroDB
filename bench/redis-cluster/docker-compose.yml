x-redis-common: &redis-common
  image: redis:8.8-alpine
  network_mode: host
  restart: "no"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

x-redis-args: &redis-args >
  redis-server
  --loadmodule /usr/local/lib/redis/modules/rejson.so
  --cluster-enabled yes
  --cluster-config-file nodes.conf
  --cluster-node-timeout 5000
  --save ""
  --appendonly no
  --hz 10
  --dynamic-hz yes
  --tcp-backlog 4096
  --tcp-keepalive 0
  --timeout 0
  --maxmemory-policy noeviction
  --lazyfree-lazy-eviction yes
  --lazyfree-lazy-expire yes
  --lazyfree-lazy-server-del yes
  --no-appendfsync-on-rewrite yes
  --activerehashing yes
  --activedefrag no
  --protected-mode no
  --loglevel warning

services:
  redis-1:
    <<: *redis-common
    container_name: redis-1
    cpuset: "0"
    command: [ "sh", "-c", "exec $$0 --port 7001", *redis-args ]

  redis-2:
    <<: *redis-common
    container_name: redis-2
    cpuset: "1"
    command: [ "sh", "-c", "exec $$0 --port 7002", *redis-args ]

  redis-3:
    <<: *redis-common
    container_name: redis-3
    cpuset: "2"
    command: [ "sh", "-c", "exec $$0 --port 7003", *redis-args ]

  redis-4:
    <<: *redis-common
    container_name: redis-4
    cpuset: "3"
    command: [ "sh", "-c", "exec $$0 --port 7004", *redis-args ]

  redis-5:
    <<: *redis-common
    container_name: redis-5
    cpuset: "4"
    command: [ "sh", "-c", "exec $$0 --port 7005", *redis-args ]

  redis-6:
    <<: *redis-common
    container_name: redis-6
    cpuset: "5"
    command: [ "sh", "-c", "exec $$0 --port 7006", *redis-args ]

  cluster-init:
    image: redis:8.8-alpine
    container_name: cluster-init
    network_mode: host
    restart: "no"
    depends_on: [ redis-1, redis-2, redis-3, redis-4, redis-5, redis-6 ]
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for p in 7001 7002 7003 7004 7005 7006; do
          until redis-cli -h 127.0.0.1 -p $$p ping 2>/dev/null | grep -q PONG; do sleep 0.2; done
        done

        # Ranges match bench/kv.go's even split for 6 nodes exactly.
        redis-cli -h 127.0.0.1 -p 7001 cluster addslotsrange 0 2730
        redis-cli -h 127.0.0.1 -p 7002 cluster addslotsrange 2731 5461
        redis-cli -h 127.0.0.1 -p 7003 cluster addslotsrange 5462 8191
        redis-cli -h 127.0.0.1 -p 7004 cluster addslotsrange 8192 10922
        redis-cli -h 127.0.0.1 -p 7005 cluster addslotsrange 10923 13653
        redis-cli -h 127.0.0.1 -p 7006 cluster addslotsrange 13654 16383

        for p in 7002 7003 7004 7005 7006; do
          redis-cli -h 127.0.0.1 -p 7001 cluster meet 127.0.0.1 $$p
        done

        for i in $$(seq 1 100); do
          ok=1
          for p in 7001 7002 7003 7004 7005 7006; do
            redis-cli -h 127.0.0.1 -p $$p cluster info | grep -q '^cluster_state:ok' || ok=0
          done
          [ "$$ok" = 1 ] && break
          sleep 0.3
        done
        redis-cli -h 127.0.0.1 -p 7001 cluster info | grep -E 'cluster_state|cluster_slots_assigned|cluster_known_nodes'
        echo "cluster ready"
