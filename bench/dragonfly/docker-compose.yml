services:
  dragonfly:
    image: ${DRAGONFLY_IMAGE:-docker.dragonflydb.io/dragonflydb/dragonfly:latest}
    container_name: dragonfly
    network_mode: host
    restart: "no"
    cpuset: ${BENCH_SERVER_CPUS:-}
    mem_limit: ${BENCH_MEMORY_LIMIT:-3g}
    memswap_limit: ${BENCH_MEMORY_LIMIT:-3g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock: -1
    command:
      - dragonfly
      - --port=6379
      - --bind=0.0.0.0
      - --proactor_threads=${DRAGONFLY_THREADS:-8}
      - --num_shards=${DRAGONFLY_SHARDS:-0}
      - --maxmemory=0
      - --cache_mode=false
      - --dbfilename=
      - --dbnum=1
      - --tcp_nodelay=true
      - --pipeline_squash=${DRAGONFLY_PIPELINE_SQUASH:-1}
      - --multi_exec_squash=true
      - --primary_port_http_enabled=false
      - --admin_nopass=true
      - --logtostderr
