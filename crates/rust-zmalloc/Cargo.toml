[package]
name = "rust-zmalloc"
version = "0.2.1"
edition = "2024"
license = "BSD-3-Clause"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
jemallocator = { version = "0.5", optional = true, features = ["background_threads_runtime_support"] }
libc = "0.2"

[features]
default = []
jemalloc = ["dep:jemallocator"]
system = []
