[package]
name = "fyro-dbcache"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "FyroDB database caching proxy engine with cross-protocol storage sharing"

[lib]
name = "fyro_dbcache"
path = "src/lib.rs"

[dependencies]
base64 = "0.23"
foldhash = "0.2.0"
getrandom = "0.4"
md-5 = "0.11"
native-tls = "0.2.18"
parking_lot = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlparser = { version = "0.63.0", features = ["visitor"] }
mio = { version = "1.2", features = ["net", "os-poll"] }
socket2 = { version = "0.6", features = ["all"] }
