[package]
name = "fyro-vector"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "FyroDB vector engine: SIMD distance kernels, quantization, HNSW and exact (FLAT) search"

[lib]
name = "fyro_vector"
path = "src/lib.rs"

[dependencies]
bytemuck = "1"
parking_lot = "0.13"
num_cpus = "1.17"
crossbeam-queue = "0.3"
libc = "0.2"
