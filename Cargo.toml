[package]
name = "fyro_db"
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
autobins = false

[workspace]
members = [
    ".",
    "crates/customhash",
    "crates/rust-zmalloc",
    "crates/fyro-vector",
    "crates/fyro-dbcache",
]
default-members = ["."]


[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[dependencies]
customhash = { path = "crates/customhash" }
fyro-vector = { path = "crates/fyro-vector" }
fyro-dbcache = { path = "crates/fyro-dbcache" }
rust-zmalloc = { path = "crates/rust-zmalloc" }
num_cpus = "1.17.0"
socket2 = { version = "0.6.5", features = ["all"] }
mio = { version = "1.2.2", features = ["net", "os-poll"] }
memchr = "2.8.3"
libc = "0.2.186"
crossbeam-queue = "0.3.13"
crossbeam-utils = "0.8.22"
foldhash = "0.2.0"
parking_lot = { version = "0.12", features = ["arc_lock"] }
bytemuck = "1"
io-uring = { version = "0.7", optional = true }
pprof = { version = "0.15", optional = true, default-features = false, features = ["frame-pointer"] }
bbtree = { version = "0.1.5", optional = true }

[[bin]]
name = "fyro_db"
path = "src/main.rs"

[[bin]]
name = "without_tcp"
path = "src/bin/without_tcp.rs"
required-features = ["bench-tools"]

[[bin]]
name = "tcp_proto_bench"
path = "src/bin/tcp_proto_bench.rs"
required-features = ["bench-tools"]

[[bin]]
name = "pg_cache_bench"
path = "src/bin/pg_cache_bench.rs"
required-features = ["bench-tools"]

[[bin]]
name = "bench_all_v"
path = "src/bin/bench_all_v.rs"
required-features = ["bench-tools"]

[[bin]]
name = "hashmap_bench"
path = "src/bin/hashmap_bench.rs"
required-features = ["bench-tools"]

[features]
io-uring = ["dep:io-uring"]
profiling = ["dep:pprof"]
bench-tools = ["dep:bbtree"]

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[profile.bench]
debug = "line-tables-only"
strip = "none"
