[package]
name = "fyro_db"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
autobins = false

[workspace]
members = [
    ".",
    "crates/customhash",
    "crates/rust-zmalloc",
    "crates/fyro-vector",
    "crates/fyro-dbcache",
]
default-members = ["."]


[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[dependencies]
customhash = { path = "crates/customhash" }
fyro-vector = { path = "crates/fyro-vector" }
fyro-dbcache = { path = "crates/fyro-dbcache" }
rust-zmalloc = { path = "crates/rust-zmalloc" }

libc = "0.2"
mio = { version = "1.2", features = ["net", "os-poll"] }
num_cpus = "1.17"
socket2 = { version = "0.6", features = ["all"] }

crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
foldhash = "0.2"
parking_lot = { version = "0.13", features = ["arc_lock"] }

bytemuck = "1"
memchr = "2.8"

mlua = { version = "0.12.2", features = ["lua54", "vendored", "serde"] }
serde_json = "1.0.154"
sha1 = "0.11.0"

io-uring = { version = "0.7", optional = true }
pprof = { version = "0.15", optional = true, default-features = false, features = ["frame-pointer"] }

[[bin]]
name = "fyro_db"
path = "src/main.rs"

[features]
io-uring = ["dep:io-uring"]
profiling = ["dep:pprof"]
bench-tools = []

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
bbtree = "0.1.5"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "cluster_perf"
harness = false

[[bench]]
name = "hashmap_bench"
harness = false

[[bench]]
name = "without_tcp"
harness = false

[[bench]]
name = "tcp_proto_bench"
harness = false
required-features = ["bench-tools"]

[[bench]]
name = "pg_cache_bench"
harness = false

[[bench]]
name = "bench_all_v"
harness = false

[[bench]]
name = "script_bench"
harness = false

[profile.bench]
debug = "line-tables-only"
strip = "none"
