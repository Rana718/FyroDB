[package]
name = "fyro_db"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false

[dependencies]
customhash = { path = "crates/customhash" }
rust-zmalloc = { path = "crates/rust-zmalloc" }
num_cpus = "1.17.0"
socket2 = { version = "0.6.5", features = ["all"] }
mio = { version = "1.2.2", features = ["net", "os-poll"] }
memchr = "2.8.3"
libc = "0.2.186"
crossbeam-queue = "0.3.13"
crossbeam-utils = "0.8.22"
foldhash = "0.2.0"
